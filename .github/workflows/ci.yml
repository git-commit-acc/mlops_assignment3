name: Docker CI/CD Workflow

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.build-image.outputs.image-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib

      - name: Train model
        run: python scripts/train.py

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/mlops_assignment3:latest
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          docker build -t $IMAGE_TAG .

      - name: Run Docker container and verify predictions
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/mlops_assignment3:latest python scripts/predict.py

  push_image:
    needs: build_and_test_container
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ needs.build_and_test_container.outputs.image-tag }}
