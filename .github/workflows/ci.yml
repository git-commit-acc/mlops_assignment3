name: Docker CI/CD Workflow

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_image_tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib

      - name: Train model
        run: python scripts/train.py

      - id: set_image_tag
        name: Set image tag and build Docker image
        shell: bash
        run: |
          IMAGE_TAG="g24ai1046/mlops_assignment3:latest"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building image with tag: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .

      - name: Debug Step output
        run: |
            echo "Step output in build job: ${{ steps.set_image_tag.outputs.image_tag }}"

      - name: Run Docker container and verify predictions
        run: |
          IMAGE_TAG="${{ steps.set_image_tag.outputs.image_tag }}"
          echo "Running container with image: $IMAGE_TAG"
          docker run --rm "$IMAGE_TAG" python scripts/predict.py

  push_image:
    needs: build_and_test_container
    runs-on: ubuntu-latest

    steps:
      - name: Debug Output from build job
        run: |
          echo "Output image_tag: ${{ needs.build_and_test_container.outputs.image_tag }}"
          echo "All outputs: ${{ toJson(needs.build_and_test_container.outputs) }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: g24ai1046
          password: Diza@IITJ007

      - name: Checkout repository (needed for rebuild)
        uses: actions/checkout@v4

      - name: Rebuild and push Docker image
        run: |
          IMAGE_TAG="${{ needs.build_and_test_container.outputs.image_tag }}"
          echo "Rebuilding and pushing image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
