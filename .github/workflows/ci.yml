name: Docker CI/CD Workflow

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.build-step.outputs.image-tag }}

    steps:
      # (a) Check out your repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # (b) Set up a Python environment and install dependencies
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib torch

      # (c) Run the train.py script to generate the .pth model file
      - name: Run train.py script
        run: |
          python scripts/train.py
          echo "✅ Training completed and model files generated"

      # (d) Build the Docker image using the Dockerfile
      - id: build-step
        name: Build Docker image using Dockerfile
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/mlops_assignment3:latest"
          echo "Building Docker image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          echo "Docker image built successfully"
          
          # Set output for Job 2
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # (e) Run the Docker container using the image just built
      - name: Run Docker container with verification script
        run: |
          IMAGE_TAG="${{ steps.build-step.outputs.image-tag }}"
          echo "Running Docker container: $IMAGE_TAG"
          echo "Executing: docker run --rm $IMAGE_TAG python scripts/predict.py"
          
          # This command must execute your verification script
          # The workflow will fail if this step fails
          docker run --rm "$IMAGE_TAG" python scripts/predict.py
          
          echo "Container verification successful"

  # Job 2: Push the image to Docker Hub registry
  push_to_registry:
    needs: build_and_test_container
    runs-on: ubuntu-latest
    
    steps:
      - name: Display received image information
        run: |
          echo "Received from Job 1:"
          echo "  Image tag: ${{ needs.build_and_test_container.outputs.image-tag }}"

      - name: Verify image tag is available
        run: |
          IMAGE_TAG="${{ needs.build_and_test_container.outputs.image-tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: No image tag received from Job 1!"
            exit 1
          fi
          echo "Image tag verified: $IMAGE_TAG"

      - name: Checkout repository
        uses: actions/checkout@v4

      # (f) Push the image to Docker Hub registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rebuild and push image to Docker Hub
        run: |
          IMAGE_TAG="${{ needs.build_and_test_container.outputs.image-tag }}"
          echo "Rebuilding image for push: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          
          echo "Pushing image to Docker Hub: $IMAGE_TAG"
          docker push "$IMAGE_TAG"
          echo "Image successfully pushed to Docker Hub"

