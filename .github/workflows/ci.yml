name: Docker CI/CD Workflow

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib

      - name: Train model
        run: python scripts/train.py

      - id: set-image-tag
        name: Set image tag and build Docker image
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/mlops_assignment3:latest"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Building image with tag: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .

      - name: Run Docker container and verify predictions
        run: |
          IMAGE_TAG="${{ steps.set-image-tag.outputs.image_tag }}"
          echo "Running container with image: $IMAGE_TAG"
          docker run --rm "$IMAGE_TAG" python scripts/predict.py

      - name: Show built image tag output
        run: echo "Built image tag is ${{ steps.set-image-tag.outputs.image_tag }}"

  push_image:
    needs: build_and_test_container
    runs-on: ubuntu-latest

    steps:
      - name: Debug output from job1
        run: |
          echo "Output image_tag: ${{ needs.build_and_test_container.outputs.image_tag }}"
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and push Docker image
        run: |
          IMAGE_TAG="${{ needs.build_and_test_container.outputs.image_tag }}"
          echo "Image tag received from build job: $IMAGE_TAG"

      - name: Checkout repository (needed for rebuild)
        uses: actions/checkout@v4
        
      - name: Rebuild and push Docker image
        run: |
          IMAGE_TAG="${{ needs.build_and_test_container.outputs.image_tag }}"
          echo "Rebuilding and pushing image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"